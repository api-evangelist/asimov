aid: asimov
name: Asimov
description: >-
  Asimov is a synthetic biology company building an integrated platform for the
  intelligent design of living systems. Its Edge Systems (CHO for biologics, LV
  for cell therapies, AAV for gene therapies, and RNA for RNA medicines) combine
  engineered mammalian host cells, a library of more than 1,000 validated genetic
  parts, and cloud-based genetic design software so biopharma partners can design
  and manufacture advanced therapeutics at higher titers and on faster timelines.
  Backed by a16z, DCVC, Wing Venture Capital, and Y Combinator. Added to the API
  Evangelist network as a company profile; no public developer API is currently
  published.
